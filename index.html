<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️ L'ENIGMA DEL COMPLEANNO ❤️</title>

<style>

body{
    font-family:'Segoe UI',sans-serif;
    background:#fff6f8;
    padding:20px;
    color:#333;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    color:#b0004f;
    margin-bottom:30px;
}

.game{
    display:flex;
    flex-wrap:wrap;
    gap:40px;
    justify-content:center;
}

.crossword{
    display:grid;
    grid-template-columns:repeat(8,55px);
    gap:2px;
}

.cell{
    width:55px;
    height:55px;
    border:1px solid #ddd;
    position:relative;
    background:white;
}

.cell.black{
    background:black;
}

.cell input{
    width:100%;
    height:100%;
    border:none;
    text-align:center;
    font-size:26px;
    font-weight:bold;
    text-transform:uppercase;
    background:transparent;
    outline:none;
    caret-color:#b0004f;
}

.cell input:focus{
    background:#fff1f7;
}

.number{
    position:absolute;
    top:2px;
    left:4px;
    font-size:10px;
    font-weight:bold;
    color:#777;
}

.clues{
    max-width:450px;
}

.clues h2{
    color:#b0004f;
}

.clues p{
    line-height:1.6;
}

#verifyBtn{

display:none;

margin-top:20px;

background:#b0004f;
color:white;

padding:15px 25px;

border:none;

border-radius:12px;

cursor:pointer;

font-size:16px;

transition:0.3s;

}

#verifyBtn:hover{

background:#8d003f;
transform:scale(1.05);

}

#success{

display:none;

margin-top:40px;

background:#fff1f7;

padding:30px;

border-radius:20px;

text-align:center;

color:#b0004f;

font-size:1.8rem;

font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<h1>
