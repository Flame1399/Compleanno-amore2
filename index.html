<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Il Cruciverba del Compleanno ❤️</title>

<style>

body{
    font-family:Segoe UI,sans-serif;
    background:#fff6f8;
    padding:20px;
    color:#333;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    color:#b0004f;
}

.game{
    display:flex;
    flex-wrap:wrap;
    gap:40px;
    justify-content:center;
}

.crossword{
    display:grid;
    grid-template-columns:repeat(8,50px);
    gap:2px;
}

.cell{


width:50px;
height:50px;

border:1px solid #ccc;

position:relative;

background:white;
}

.cell.black{
background:black;
}

.cell input{

width:100%;
height:100%;

border:none;

text-align:center;

font-size:22px;

text-transform:uppercase;

outline:none;

}

.number{

position:absolute;

top:2px;
left:4px;

font-size:10px;
font-weight:bold;

color:#666;

}

.clues{

max-width:450px;

}

.clues h2{

color:#b0004f;

}

.correct{

background:#c8f7c8 !important;

}

#success{

display:none;

margin-top:30px;

text-align:center;

font-size:2rem;

color:#b0004f;

font-weight:bold;

}

</style>

</head>
